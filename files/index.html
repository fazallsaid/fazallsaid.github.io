<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>File Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── LOGIN ── */
    #login-screen {
      background: #1a1d27;
      border: 1px solid #2e3147;
      border-radius: 12px;
      padding: 40px 48px;
      width: 360px;
      text-align: center;
    }
    #login-screen h2 { font-size: 1.4rem; margin-bottom: 6px; color: #fff; }
    #login-screen p  { font-size: 0.85rem; color: #888; margin-bottom: 28px; }

    .input-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .input-wrap input {
      width: 100%;
      padding: 11px 42px 11px 14px;
      background: #0f1117;
      border: 1px solid #2e3147;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s;
    }
    .input-wrap input:focus { border-color: #5b6af0; }
    .toggle-pw {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      cursor: pointer; color: #666; font-size: 1rem;
      background: none; border: none;
    }

    #login-btn {
      width: 100%;
      padding: 11px;
      background: #5b6af0;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background .2s;
    }
    #login-btn:hover { background: #4a58d8; }

    #login-error {
      margin-top: 12px;
      font-size: 0.82rem;
      color: #f07070;
      display: none;
    }

    /* ── FILE MANAGER ── */
    #app {
      display: none;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
    }

    header {
      background: #1a1d27;
      border-bottom: 1px solid #2e3147;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header .brand { font-size: 1rem; font-weight: 600; color: #fff; }
    header .brand span { color: #5b6af0; }

    #logout-btn {
      background: none;
      border: 1px solid #2e3147;
      color: #aaa;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all .2s;
    }
    #logout-btn:hover { border-color: #f07070; color: #f07070; }

    .toolbar {
      background: #13151f;
      border-bottom: 1px solid #2e3147;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: #1a1d27;
      border: 1px solid #2e3147;
      color: #ccc;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all .2s;
    }
    .nav-btn:hover:not(:disabled) { background: #2a2d3e; color: #fff; }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }

    #breadcrumb {
      flex: 1;
      background: #0f1117;
      border: 1px solid #2e3147;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.82rem;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #breadcrumb span { color: #5b6af0; cursor: pointer; }
    #breadcrumb span:hover { text-decoration: underline; }

    .view-toggle button {
      background: #1a1d27;
      border: 1px solid #2e3147;
      color: #888;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all .2s;
    }
    .view-toggle button:first-child { border-radius: 6px 0 0 6px; }
    .view-toggle button:last-child  { border-radius: 0 6px 6px 0; border-left: none; }
    .view-toggle button.active { background: #5b6af0; color: #fff; border-color: #5b6af0; }

    #search-box {
      background: #0f1117;
      border: 1px solid #2e3147;
      border-radius: 6px;
      padding: 6px 12px;
      color: #e0e0e0;
      font-size: 0.82rem;
      outline: none;
      width: 180px;
      transition: border-color .2s;
    }
    #search-box:focus { border-color: #5b6af0; }

    /* ── CONTENT ── */
    #content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    /* Grid view */
    #file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
    }

    .file-item {
      background: #1a1d27;
      border: 1px solid #2e3147;
      border-radius: 10px;
      padding: 16px 12px 12px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      user-select: none;
    }
    .file-item:hover { background: #22263a; border-color: #5b6af0; transform: translateY(-2px); }

    .file-icon { font-size: 2.4rem; margin-bottom: 8px; display: block; }
    .file-name {
      font-size: 0.75rem;
      color: #ccc;
      word-break: break-word;
      line-height: 1.3;
    }
    .file-type-badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #2e3147;
      color: #888;
      text-transform: uppercase;
    }

    /* List view */
    #file-list { display: none; }
    #file-list table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    #file-list th {
      text-align: left;
      padding: 10px 14px;
      background: #1a1d27;
      color: #888;
      font-weight: 500;
      border-bottom: 1px solid #2e3147;
    }
    #file-list td {
      padding: 10px 14px;
      border-bottom: 1px solid #1e2130;
      color: #ccc;
      cursor: pointer;
    }
    #file-list tr:hover td { background: #1e2235; }
    #file-list .row-icon { font-size: 1.1rem; margin-right: 8px; }

    #empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #555;
      display: none;
    }
    #empty-state .big { font-size: 3rem; margin-bottom: 12px; }

    /* ── THUMBNAIL ── */
    .file-thumb {
      width: 100%;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
      background: #0f1117;
      display: block;
    }
    .file-item.has-thumb { padding: 10px 10px 12px; }
    .file-item.has-thumb .file-icon { display: none; }

    .file-item { position: relative; }
    .file-actions {
      position: absolute;
      top: 6px; right: 6px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity .15s;
      z-index: 2;
    }
    .file-item:hover .file-actions { opacity: 1; }
    .item-btn {
      background: rgba(15,17,23,.85);
      border: 1px solid #2e3147;
      color: #aaa;
      border-radius: 5px;
      padding: 3px 6px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all .15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .item-btn:hover { color: #5b6af0; border-color: #5b6af0; background: #1a1d27; }

    .file-type-badge.size {
      background: #1e2235;
      color: #a0aec0;
      margin-left: 3px;
    }

    .row-copy, .row-dl {
      background: none;
      border: 1px solid #2e3147;
      color: #aaa;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all .15s;
    }
    .row-copy { margin-right: 6px; }
    .row-copy:hover, .row-dl:hover { color: #5b6af0; border-color: #5b6af0; }

    /* ── NON-IMAGE PREVIEW CARD ── */
    #preview-card {
      background: #1a1d27;
      border: 1px solid #2e3147;
      border-radius: 14px;
      padding: 32px 28px;
      max-width: 460px;
      width: 90vw;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .pcard-icon {
      font-size: 3.5rem;
      margin-bottom: 4px;
      line-height: 1;
    }
    .pcard-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      word-break: break-word;
      line-height: 1.3;
    }
    .pcard-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .pcard-badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: #2e3147;
      color: #5b6af0;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .pcard-badge.size {
      color: #a0aec0;
      background: #25283a;
    }
    .pcard-desc {
      font-size: 0.82rem;
      color: #888;
      line-height: 1.5;
      margin-top: 4px;
    }
    .pcard-path {
      font-size: 0.72rem;
      color: #666;
      word-break: break-all;
      background: #0f1117;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #22263a;
      width: 100%;
    }

    #preview-copy {
      background: none;
      border: 1px solid #2e3147;
      color: #ccc;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all .2s;
    }
    #preview-copy:hover { border-color: #5b6af0; color: #5b6af0; }

    /* ── TOAST NOTIFICATION ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: #1a1d27;
      border: 1px solid #5b6af0;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── PREVIEW MODAL ── */
    #preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      backdrop-filter: blur(4px);
    }
    #preview-modal.open { display: flex; }

    #preview-modal img {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 10px;
      box-shadow: 0 8px 40px rgba(0,0,0,.6);
      object-fit: contain;
    }

    #preview-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a1d27;
      border: 1px solid #2e3147;
      border-radius: 10px;
      padding: 10px 18px;
    }
    #preview-name { font-size: 0.88rem; color: #ccc; }
    #preview-open {
      background: #5b6af0;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    #preview-open:hover { background: #4a58d8; }
    #preview-dl {
      background: none;
      border: 1px solid #2e3147;
      color: #ccc;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all .2s;
    }
    #preview-dl:hover { border-color: #5b6af0; color: #5b6af0; }
    #preview-close {
      background: none;
      border: 1px solid #2e3147;
      color: #aaa;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    #preview-close:hover { border-color: #f07070; color: #f07070; }

    #preview-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
      pointer-events: none;
    }
    .pnav-btn {
      pointer-events: all;
      background: rgba(26,29,39,.85);
      border: 1px solid #2e3147;
      color: #ccc;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all .2s;
    }
    .pnav-btn:hover { background: #5b6af0; color: #fff; border-color: #5b6af0; }

    /* status bar */
    #statusbar {
      background: #1a1d27;
      border-top: 1px solid #2e3147;
      padding: 6px 24px;
      font-size: 0.75rem;
      color: #555;
      display: flex;
      justify-content: space-between;
    }
    /* loading spin */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <h2>🔐 File Manager</h2>
  <p>Masukkan kunci akses untuk melanjutkan</p>
  <div class="input-wrap">
    <input type="password" id="pw-input" placeholder="Kunci akses..." />
    <button class="toggle-pw" onclick="togglePw()" title="Tampilkan/sembunyikan">👁</button>
  </div>
  <button id="login-btn" onclick="doLogin()">Masuk</button>
  <div id="login-error">Kunci salah. Coba lagi.</div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="brand"><span>📁</span> File Manager</div>
    <button id="logout-btn" onclick="doLogout()">Keluar</button>
  </header>

  <div class="toolbar">
    <button class="nav-btn" id="btn-back" onclick="goBack()" disabled>← Back</button>
    <button class="nav-btn" id="btn-up"   onclick="goUp()"   disabled>↑ Up</button>
    <button class="nav-btn" id="btn-refresh" onclick="refreshTree()" title="Segarkan file tree">⟳ Refresh</button>
    <div id="breadcrumb">~</div>
    <div class="view-toggle">
      <button id="btn-grid" class="active" onclick="setView('grid')" title="Grid">⊞</button>
      <button id="btn-list"               onclick="setView('list')" title="List">☰</button>
    </div>
    <input id="search-box" type="text" placeholder="Cari file..." oninput="renderCurrent()" />
  </div>

  <div id="content">
    <div id="file-grid"></div>
    <div id="file-list"><table><thead><tr>
      <th>Nama</th><th>Tipe</th><th></th>
    </tr></thead><tbody id="list-body"></tbody></table></div>
    <div id="empty-state"><div class="big">🗂️</div>Folder ini kosong</div>
  </div>

  <div id="statusbar">
    <span id="stat-path">/</span>
    <span id="stat-count"></span>
  </div>
</div>

<!-- PREVIEW MODAL -->
<div id="preview-modal" onclick="closePreview(event)">
  <div id="preview-nav">
    <button class="pnav-btn" onclick="previewNav(-1); event.stopPropagation()">‹</button>
    <button class="pnav-btn" onclick="previewNav(1);  event.stopPropagation()">›</button>
  </div>
  <img id="preview-img" src="" alt="" />
  <!-- Card Preview for Non-Images (like .exe, archives, docs) -->
  <div id="preview-card" style="display:none;" onclick="event.stopPropagation()">
    <div id="pcard-icon" class="pcard-icon">💻</div>
    <div id="pcard-title" class="pcard-title"></div>
    <div class="pcard-badges">
      <span id="pcard-type" class="pcard-badge">EXE</span>
      <span id="pcard-size" class="pcard-badge size"></span>
    </div>
    <p id="pcard-desc" class="pcard-desc"></p>
    <div id="pcard-path" class="pcard-path"></div>
  </div>
  <div id="preview-bar" onclick="event.stopPropagation()">
    <span id="preview-name"></span>
    <button id="preview-copy" onclick="copyCurrentPreviewLink()">🔗 Salin Link</button>
    <button id="preview-open" onclick="window.open(previewList[previewIdx].path,'_blank')">Buka asli ↗</button>
    <button id="preview-dl"   onclick="downloadFile(previewList[previewIdx].path, previewList[previewIdx].name)">⬇ Download</button>
    <button id="preview-close" onclick="closePreview()">✕ Tutup</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast">
  <span>📋</span> <span id="toast-msg">Tautan berhasil disalin!</span>
</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────
  const HASH        = "9e864ba77d5cd0f93c1da1db84cc42db3c79589ca0e096dab4175ad61327bb33";
  const SESSION_KEY = "fm_auth";
  const REPO        = "fazallsaid/fazallsaid.github.io";
  const BRANCH      = "main";
  const BASE_PATH   = "files"; // folder root yg ditampilin di file manager
  const TREE_CACHE  = "fm_tree_cache_v3";
  const CACHE_TTL   = 5 * 60 * 1000; // 5 menit

  // ── DYNAMIC TREE via GITHUB API ─────────────────────────────────────────
  let TREE = null; // will be populated after login

  async function fetchTree() {
    // cek cache dulu
    try {
      const cached = sessionStorage.getItem(TREE_CACHE);
      if (cached) {
        const { ts, data } = JSON.parse(cached);
        if (Date.now() - ts < CACHE_TTL) {
          TREE = data;
          return;
        }
      }
    } catch(_) {}

    showLoading(true);
    try {
      const url = `https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
      const json = await res.json();

      // build tree dari flat list
      TREE = buildTree(json.tree);

      // simpan ke cache
      sessionStorage.setItem(TREE_CACHE, JSON.stringify({ ts: Date.now(), data: TREE }));
    } catch (err) {
      showError("Gagal memuat file tree: " + err.message);
    } finally {
      showLoading(false);
    }
  }

  function buildTree(items) {
    // filter hanya path yg berada di bawah BASE_PATH
    const filtered = items.filter(item =>
      item.path.startsWith(BASE_PATH + "/") || item.path === BASE_PATH
    );

    const root = { "~": { type: "dir", children: {} } };

    for (const item of filtered) {
      // hapus prefix BASE_PATH dari path
      const rel = item.path.slice(BASE_PATH.length + 1); // e.g. "assets/images/others/hutri81/logo.png"
      if (!rel) continue;

      const parts = rel.split("/");
      let cur = root["~"].children;

      for (let i = 0; i < parts.length; i++) {
        const part = parts[i];
        const isLast = i === parts.length - 1;

        if (isLast) {
          if (item.type === "blob") {
            // file — path relatif dari dalam folder files/
            cur[part] = {
              type: "file",
              path: rel,
              size: item.size || 0,
            };
          }
          // jika tree (folder) sudah dibuat oleh child sebelumnya, skip
        } else {
          // folder — buat kalau belum ada
          if (!cur[part]) {
            cur[part] = { type: "dir", children: {} };
          }
          cur = cur[part].children;
        }
      }
    }

    return root;
  }

  function showLoading(show) {
    const grid  = document.getElementById("file-grid");
    const list  = document.getElementById("file-list");
    let loader  = document.getElementById("api-loader");

    if (show) {
      if (!loader) {
        loader = document.createElement("div");
        loader.id = "api-loader";
        loader.innerHTML = `
          <div style="text-align:center;padding:60px 20px;color:#555">
            <div style="font-size:2.5rem;margin-bottom:12px;animation:spin 1s linear infinite;display:inline-block">⟳</div>
            <div style="font-size:0.9rem">Memuat file tree dari GitHub...</div>
          </div>
        `;
        document.getElementById("content").prepend(loader);
      }
      loader.style.display = "block";
      grid.style.display = "none";
      list.style.display = "none";
    } else {
      if (loader) loader.style.display = "none";
    }
  }

  function showError(msg) {
    const content = document.getElementById("content");
    let err = document.getElementById("api-error");
    if (!err) {
      err = document.createElement("div");
      err.id = "api-error";
      err.style.cssText = "text-align:center;padding:40px;color:#f07070;font-size:0.9rem";
      content.prepend(err);
    }
    err.innerHTML = `⚠️ ${msg}<br><br><button onclick="retryFetch()" style="background:#5b6af0;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer">Coba Lagi</button>`;
    err.style.display = "block";
  }

  async function retryFetch() {
    sessionStorage.removeItem(TREE_CACHE);
    const err = document.getElementById("api-error");
    if (err) err.style.display = "none";
    await fetchTree();
    if (TREE) renderCurrent();
  }

  async function refreshTree() {
    sessionStorage.removeItem(TREE_CACHE);
    const btn = document.getElementById("btn-refresh");
    const origText = btn ? btn.innerHTML : "⟳ Refresh";
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `<span style="display:inline-block;animation:spin 1s linear infinite">⟳</span> Memuat...`;
    }
    await fetchTree();
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = origText;
    }
    if (TREE) renderCurrent();
  }

  function handleThumbError(img) {
    if (!img.dataset.retried) {
      img.dataset.retried = "1";
      // Auto-retry sekali setelah 2.5s jika deploy GitHub Pages masih berlangsung
      setTimeout(() => {
        try {
          const url = new URL(img.src, window.location.href);
          url.searchParams.set("t", Date.now());
          img.src = url.href;
        } catch (_) {}
      }, 2500);
    } else {
      img.style.display = "none";
      if (img.nextElementSibling) {
        img.nextElementSibling.style.display = "block";
      }
    }
  }

  function handleThumbLoad(img) {
    img.style.display = "block";
    if (img.nextElementSibling) {
      img.nextElementSibling.style.display = "none";
    }
  }

  // ── AUTH ─────────────────────────────────────────────────────────────────
  async function sha256(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }

  async function doLogin() {
    const val = document.getElementById("pw-input").value;
    const h   = await sha256(val);
    if (h === HASH) {
      sessionStorage.setItem(SESSION_KEY, "1");
      await showApp();
    } else {
      const err = document.getElementById("login-error");
      err.style.display = "block";
      setTimeout(() => err.style.display = "none", 3000);
    }
  }

  function doLogout() {
    sessionStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem(TREE_CACHE);
    TREE = null;
    document.getElementById("app").style.display = "none";
    document.getElementById("login-screen").style.display = "block";
    document.getElementById("pw-input").value = "";
    document.body.style.alignItems = "center";
  }

  function togglePw() {
    const inp = document.getElementById("pw-input");
    inp.type = inp.type === "password" ? "text" : "password";
  }

  document.getElementById("pw-input").addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin();
  });

  // ── NAVIGATION ───────────────────────────────────────────────────────────
  let currentPath = ["~"];
  let history     = [];
  let viewMode    = "grid";

  function getNode(pathArr) {
    let node = TREE["~"];
    for (let i = 1; i < pathArr.length; i++) {
      if (!node.children) return null;
      node = node.children[pathArr[i]];
      if (!node) return null;
    }
    return node;
  }

  function navigate(name) {
    history.push([...currentPath]);
    currentPath.push(name);
    renderCurrent();
  }

  function goBack() {
    if (!history.length) return;
    currentPath = history.pop();
    renderCurrent();
  }

  function goUp() {
    if (currentPath.length <= 1) return;
    history.push([...currentPath]);
    currentPath.pop();
    renderCurrent();
  }

  function goTo(idx) {
    history.push([...currentPath]);
    currentPath = currentPath.slice(0, idx + 1);
    renderCurrent();
  }

  // ── ICONS ────────────────────────────────────────────────────────────────
  const IMAGE_EXTS = new Set(["png","jpg","jpeg","webp","gif","svg","bmp"]);

  function isImage(name) {
    return IMAGE_EXTS.has(name.split(".").pop().toLowerCase());
  }

  function getIcon(name, type) {
    if (type === "dir") return "📁";
    const ext = name.split(".").pop().toLowerCase();
    const map = {
      png:"🖼️", jpg:"🖼️", jpeg:"🖼️", webp:"🖼️", gif:"🖼️", svg:"🖼️",
      pdf:"📄", pptx:"📊", ppt:"📊", xlsx:"📗", xls:"📗", docx:"📝", doc:"📝",
      zip:"🗜️", rar:"🗜️", "7z":"🗜️",
      mp4:"🎬", mkv:"🎬", avi:"🎬",
      mp3:"🎵", wav:"🎵",
      html:"🌐", css:"🎨", js:"⚙️", ts:"⚙️", php:"🐘",
      csv:"📋", txt:"📃", json:"📋", xml:"📋",
      exe:"💻", msi:"📦", apk:"📱", dmg:"💿", iso:"💿",
    };
    return map[ext] || "📎";
  }

  function getExt(name) {
    const parts = name.split(".");
    return parts.length > 1 ? parts.pop().toUpperCase() : "—";
  }

  // ── HELPERS: FORMAT & COPY ──────────────────────────────────────────────
  function formatBytes(bytes) {
    if (!bytes || bytes <= 0) return "";
    const k = 1024;
    const sizes = ["B", "KB", "MB", "GB"];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
  }

  function copyFileLink(path, name) {
    const fullUrl = new URL(path, window.location.href).href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(fullUrl).then(() => {
        showToast(`Tautan "${name || 'file'}" berhasil disalin!`);
      }).catch(() => {
        fallbackCopy(fullUrl, name);
      });
    } else {
      fallbackCopy(fullUrl, name);
    }
  }

  function fallbackCopy(text, name) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      showToast(`Tautan "${name || 'file'}" berhasil disalin!`);
    } catch (_) {
      prompt("Salin tautan berikut:", text);
    }
    ta.remove();
  }

  let toastTimer = null;
  function showToast(msg) {
    const toast = document.getElementById("toast");
    const toastMsg = document.getElementById("toast-msg");
    if (!toast) return;
    toastMsg.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 2800);
  }

  function copyCurrentPreviewLink() {
    if (!previewList.length || !previewList[previewIdx]) return;
    const f = previewList[previewIdx];
    copyFileLink(f.path, f.name);
  }

  // ── RENDER ───────────────────────────────────────────────────────────────
  function renderCurrent() {
    if (!TREE) return;

    const node   = getNode(currentPath);
    const query  = document.getElementById("search-box").value.toLowerCase();
    const grid   = document.getElementById("file-grid");
    const list   = document.getElementById("list-body");
    const empty  = document.getElementById("empty-state");

    grid.innerHTML = "";
    list.innerHTML = "";

    // restore view
    grid.style.display = viewMode === "grid" ? "grid" : "none";
    document.getElementById("file-list").style.display = viewMode === "list" ? "block" : "none";

    // breadcrumb
    const bc = document.getElementById("breadcrumb");
    bc.innerHTML = currentPath.map((seg, i) =>
      `<span onclick="goTo(${i})">${seg}</span>`
    ).join(" / ");

    // nav buttons
    document.getElementById("btn-back").disabled = history.length === 0;
    document.getElementById("btn-up").disabled   = currentPath.length <= 1;

    if (!node || node.type !== "dir") return;

    let entries = Object.entries(node.children);

    // filter
    if (query) entries = entries.filter(([n]) => n.toLowerCase().includes(query));

    // sort: dirs first
    entries.sort(([an, av], [bn, bv]) => {
      if (av.type === bv.type) return an.localeCompare(bn);
      return av.type === "dir" ? -1 : 1;
    });

    if (entries.length === 0) {
      empty.style.display = "block";
      document.getElementById("stat-count").textContent = "0 item";
    } else {
      empty.style.display = "none";
      document.getElementById("stat-count").textContent = `${entries.length} item`;
    }

    document.getElementById("stat-path").textContent = currentPath.join(" / ");

    entries.forEach(([name, node]) => {
      if (viewMode === "grid") {
        const el = document.createElement("div");
        el.className = "file-item";
        const img = (node.type === "file" && isImage(name))
          ? `<img class="file-thumb" src="${node.path}" alt="${name}" loading="lazy" onload="handleThumbLoad(this)" onerror="handleThumbError(this)" /><span class="file-icon" style="display:none">${getIcon(name, node.type)}</span>`
          : `<span class="file-icon">${getIcon(name, node.type)}</span>`;
        if (node.type === "file" && isImage(name)) el.classList.add("has-thumb");
        el.innerHTML = `
          ${img}
          <div class="file-name">${name}</div>
          <div style="display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px;">
            <span class="file-type-badge">${node.type === "dir" ? "folder" : getExt(name)}</span>
            ${node.type === "file" && node.size ? `<span class="file-type-badge size">${formatBytes(node.size)}</span>` : ""}
          </div>
          ${node.type === "file" ? `
            <div class="file-actions">
              <button class="item-btn copy-btn" title="Salin Link">🔗</button>
              <button class="item-btn dl-btn" title="Download">⬇</button>
            </div>
          ` : ""}
        `;
        el.onclick = () => node.type === "dir" ? navigate(name) : openFile(node.path, name);
        if (node.type === "file") {
          el.querySelector(".dl-btn").onclick = e => {
            e.stopPropagation();
            downloadFile(node.path, name);
          };
          el.querySelector(".copy-btn").onclick = e => {
            e.stopPropagation();
            copyFileLink(node.path, name);
          };
        }
        grid.appendChild(el);
      } else {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><span class="row-icon">${getIcon(name, node.type)}</span>${name}</td>
          <td>${node.type === "dir" ? "Folder" : getExt(name) + (node.size ? " · " + formatBytes(node.size) : "")}</td>
          <td style="text-align:right;">${node.type === "file" ? `
            <button class="row-copy" title="Salin Link">🔗 Salin Link</button>
            <button class="row-dl" title="Download">⬇ Download</button>
          ` : ""}</td>
        `;
        tr.onclick = () => node.type === "dir" ? navigate(name) : openFile(node.path, name);
        if (node.type === "file") {
          tr.querySelector(".row-dl").onclick = e => {
            e.stopPropagation();
            downloadFile(node.path, name);
          };
          tr.querySelector(".row-copy").onclick = e => {
            e.stopPropagation();
            copyFileLink(node.path, name);
          };
        }
        list.appendChild(tr);
      }
    });
  }

  // ── DOWNLOAD ─────────────────────────────────────────────────────────────
  function downloadFile(path, name) {
    const a = document.createElement("a");
    a.href     = path;
    a.download = name;
    a.click();
  }

  // ── PREVIEW ──────────────────────────────────────────────────────────────
  let previewList   = [];
  let previewIdx    = 0;
  let isCardPreview = false;

  function openFile(path, name) {
    const node = getNode(currentPath);
    const entry = node?.children?.[name];
    if (isImage(name)) {
      isCardPreview = false;
      previewList = Object.entries(node.children)
        .filter(([n, v]) => v.type === "file" && isImage(n))
        .map(([n, v]) => ({ name: n, path: v.path, size: v.size }));
      previewIdx = previewList.findIndex(f => f.path === path);
      showPreview();
    } else {
      isCardPreview = true;
      previewList = [{
        name: name,
        path: path,
        size: entry?.size || 0
      }];
      previewIdx = 0;
      showPreview();
    }
  }

  function showPreview() {
    const f = previewList[previewIdx];
    if (!f) return;
    const modal     = document.getElementById("preview-modal");
    const img       = document.getElementById("preview-img");
    const card      = document.getElementById("preview-card");
    const nav       = document.getElementById("preview-nav");
    const nameEl    = document.getElementById("preview-name");

    nameEl.textContent = f.name;

    if (isCardPreview) {
      img.style.display  = "none";
      nav.style.display  = "none";
      card.style.display = "flex";

      const ext = f.name.split(".").pop().toLowerCase();
      document.getElementById("pcard-icon").textContent  = getIcon(f.name, "file");
      document.getElementById("pcard-title").textContent = f.name;
      document.getElementById("pcard-type").textContent  = ext ? `${ext.toUpperCase()} File` : "File";
      
      const sizeBadge = document.getElementById("pcard-size");
      if (f.size) {
        sizeBadge.textContent   = formatBytes(f.size);
        sizeBadge.style.display = "inline-block";
      } else {
        sizeBadge.style.display = "none";
      }

      const descEl = document.getElementById("pcard-desc");
      if (ext === "exe") {
        descEl.textContent = "Aplikasi desktop installer Windows (.exe). Unduh file setup ini untuk menginstal atau menjalankan aplikasi di komputer Windows.";
      } else if (ext === "zip" || ext === "rar" || ext === "7z") {
        descEl.textContent = "Berkas arsip terkompresi. Ekstrak setelah mengunduh untuk mengakses file di dalamnya.";
      } else if (ext === "pdf" || ext === "docx" || ext === "xlsx") {
        descEl.textContent = "Berkas dokumen. Klik Download atau Buka Asli untuk melihat isi dokumen.";
      } else {
        descEl.textContent = "Berkas dapat diunduh langsung atau disalin tautannya untuk dibagikan.";
      }

      document.getElementById("pcard-path").textContent = f.path;
    } else {
      card.style.display = "none";
      img.style.display  = "block";
      img.src            = f.path;
      nav.style.display  = previewList.length > 1 ? "flex" : "none";
    }

    modal.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closePreview(e) {
    if (e && e.target !== document.getElementById("preview-modal") && e.target !== document.getElementById("preview-close")) return;
    const modal = document.getElementById("preview-modal");
    modal.classList.remove("open");
    document.getElementById("preview-img").src = "";
    document.getElementById("preview-card").style.display = "none";
    document.body.style.overflow = "";
  }

  function previewNav(dir) {
    if (!previewList.length || isCardPreview) return;
    previewIdx = (previewIdx + dir + previewList.length) % previewList.length;
    showPreview();
  }

  document.addEventListener("keydown", e => {
    const modal = document.getElementById("preview-modal");
    if (!modal.classList.contains("open")) return;
    if (e.key === "Escape")      { closePreview(); }
    if (e.key === "ArrowRight")  { previewNav(1); }
    if (e.key === "ArrowLeft")   { previewNav(-1); }
  });

  // ── VIEW TOGGLE ──────────────────────────────────────────────────────────
  function setView(mode) {
    viewMode = mode;
    document.getElementById("file-grid").style.display = mode === "grid" ? "grid" : "none";
    document.getElementById("file-list").style.display = mode === "list" ? "block" : "none";
    document.getElementById("btn-grid").classList.toggle("active", mode === "grid");
    document.getElementById("btn-list").classList.toggle("active", mode === "list");
    renderCurrent();
  }

  // ── INIT ─────────────────────────────────────────────────────────────────
  async function showApp() {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "flex";
    document.body.style.alignItems = "flex-start";
    await fetchTree();
    if (TREE) renderCurrent();
  }

  if (sessionStorage.getItem(SESSION_KEY) === "1") {
    showApp();
  }

</script>
</body>
</html>
