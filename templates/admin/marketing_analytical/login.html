<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Marketing Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f8fafc; /* Latar belakang utama lebih terang (slate-50) */
            color: #1e293b; /* Warna teks utama (slate-800) */
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex" oncontextmenu="return false;"><div id="mobile-warning" class="fixed inset-0 bg-white z-50 flex items-center justify-center p-6 hidden"><div class="text-center"><div class="mb-4"><svg class="w-16 h-16 mx-auto text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg></div><h2 class="text-2xl font-bold text-gray-900 mb-2">Halaman Admin</h2><p class="text-gray-600 mb-4">Halaman admin ini direkomendasikan untuk dibuka di laptop atau PC. Penggunaan di mobile atau tablet mungkin tidak optimal.</p><button onclick="document.getElementById('mobile-warning').classList.add('hidden')" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Lanjutkan</button></div></div><script>if (window.innerWidth < 768) { document.getElementById('mobile-warning').classList.remove('hidden'); }</script> 
    <!-- Bagian Kiri: Gambar -->
    <div class="hidden md:flex md:w-1/2 bg-cover bg-center relative" style="background-image: url('https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=2070&auto=format&fit=crop');">
        <!-- Overlay gelap transparan untuk meningkatkan keterbacaan teks di atas gambar jika diperlukan -->
        <div class="absolute inset-0 bg-black/20"></div>
        <!-- Opsional: Teks atau elemen branding di sisi kiri -->
        <!--
        <div class="relative z-10 p-12 text-white">
            <h2 class="text-4xl font-bold mb-4">Analytics Pro</h2>
            <p class="text-xl opacity-90">Monitor, analisis, dan tingkatkan performa pemasaran Anda.</p>
        </div>
        -->
    </div>

    <!-- Bagian Kanan: Formulir Login -->
    <div class="w-full md:w-1/2 flex items-center justify-center p-6 bg-slate-50"> <!-- Latar belakang putih untuk bagian form -->
        <!-- Formulir tanpa bingkai apapun -->
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center bg-slate-100/80 p-3 rounded-full mb-6 border border-slate-200">
                    <svg class="w-10 h-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                </div>
                <h1 class="text-4xl font-bold text-slate-900">Analytics Dashboard</h1> <!-- Warna judul gelap -->
                <p class="text-slate-600 mt-3">Silakan masuk untuk melanjutkan</p> <!-- Warna subjudul abu-abu -->
            </div>

            <form action="index.html" method="GET" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Alamat Email</label> <!-- Warna label -->
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
                        </span>
                        <input type="email" id="email" name="email" required placeholder="admin@example.com"
                               class="w-full pl-10 pr-4 py-3 bg-white border border-slate-300 rounded-lg text-slate-900 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                    </div>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-2">Kata Sandi</label> <!-- Warna label -->
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </span>
                        <input type="password" id="password" name="password" required placeholder="**********"
                               class="w-full pl-10 pr-4 py-3 bg-white border border-slate-300 rounded-lg text-slate-900 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                    </div>
                </div>
                <div class="flex items-center justify-between text-sm">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-slate-400 rounded bg-slate-50">
                        <label for="remember-me" class="ml-2 block text-slate-700">Ingat saya</label>
                    </div>
                    <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500 transition">Lupa kata sandi?</a>
                </div>
                <div>
                    <button type="submit"
                            class="w-full px-4 py-3 text-lg font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-all duration-300 shadow-lg shadow-indigo-600/30 transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-50 focus:ring-indigo-500">
                        Masuk
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
