<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Yuuka's Adventure: V10 Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Press Start 2P', cursive;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>

<body>

    <script>
        const fontPrimary = '"Press Start 2P", cursive';

        // --- SCENE 1: MAIN MENU ---
        class MainMenu extends Phaser.Scene {
            constructor() {
                super({ key: 'MainMenu' });
            }

            preload() {
                this.load.image('bg', 'img/bg.jpeg');
                this.load.image('idle', 'img/pose_depan.png');
                this.load.image('run_right', 'img/pose_samping_kanan.png');
                this.load.image('run_left', 'img/pose_samping_kiri.png');
                this.load.image('enemy_left', 'img/enemy_left.png');
                this.load.image('enemy_right', 'img/enemy_right.png');

                let g = this.make.graphics({ x: 0, y: 0, add: false });
                g.fillStyle(0x2ea73f, 1);
                g.fillRect(0, 0, 32, 32);
                g.generateTexture('ground_sprite', 32, 32);

                let d = this.make.graphics({ x: 0, y: 0, add: false });
                d.fillStyle(0xFFD700, 1);
                d.fillRect(0, 0, 50, 80);
                d.generateTexture('door', 50, 80);
            }

            create() {
                const w = this.scale.width;
                const h = this.scale.height;

                let bg = this.add.image(w / 2, h / 2, 'bg');
                bg.setDisplaySize(w, h);
                bg.setTint(0x666666);

                this.add.text(w / 2, h / 3, 'PIXEL\nADVENTURE', {
                    fontSize: '6vw',
                    fill: '#FFD700',
                    stroke: '#000',
                    strokeThickness: 8,
                    fontFamily: fontPrimary,
                    align: 'center'
                }).setOrigin(0.5);

                let startText = this.add.text(w / 2, h / 1.5, 'PRESS SPACE TO START', {
                    fontSize: '2vw',
                    fill: '#fff',
                    fontFamily: fontPrimary
                }).setOrigin(0.5);

                this.tweens.add({
                    targets: startText,
                    alpha: 0,
                    duration: 800,
                    yoyo: true,
                    repeat: -1
                });

                this.input.keyboard.once('keydown-SPACE', () => {
                    this.scene.start('Level1');
                });
            }
        }

        // --- SCENE 2: GAMEPLAY ---
        class Level1 extends Phaser.Scene {
            constructor() {
                super({ key: 'Level1' });
            }

            create() {
                // FIX LAYOUT: Always re-calculate screen size on create/restart
                const screenW = this.scale.width;
                const screenH = this.scale.height;
                const mapWidth = 5000;

                // 1. WORLD SETUP
                this.physics.world.setBounds(0, 0, mapWidth, screenH + 200);
                this.cameras.main.setBounds(0, 0, mapWidth, screenH);

                // FIX LAYOUT: Set viewport to ensure it matches window
                this.cameras.main.setViewport(0, 0, screenW, screenH);

                // Background Fixed
                this.bg = this.add.image(screenW / 2, screenH / 2, 'bg');
                this.bg.setDisplaySize(screenW, screenH);
                this.bg.setScrollFactor(0);

                // 2. PLATFORMS
                this.platforms = this.physics.add.staticGroup();

                let currentX = 0;
                while (currentX < mapWidth) {
                    let segmentWidth = Phaser.Math.Between(500, 1000);
                    for (let i = 0; i < segmentWidth; i += 32) {
                        if (currentX + i > mapWidth) break;
                        this.platforms.create(currentX + i, screenH - 32, 'ground_sprite').refreshBody();
                    }
                    let gapSize = Phaser.Math.Between(150, 300);
                    currentX += segmentWidth + gapSize;
                }

                for (let i = 0; i < 30; i++) {
                    let x = Phaser.Math.Between(300, mapWidth - 300);
                    let y = Phaser.Math.Between(screenH - 150, screenH - 400);
                    let w = Phaser.Math.Between(2, 6);
                    this.platforms.create(x, y, 'ground_sprite').setScale(w, 1).refreshBody();
                }

                // Pintu Finish
                this.door = this.physics.add.sprite(mapWidth - 100, screenH - 100, 'door');
                this.door.body.allowGravity = false;
                this.door.setImmovable(true);

                // 3. PROJECTILES GROUP
                this.swordWaves = this.physics.add.group();

                // 4. PLAYER
                this.player = this.physics.add.sprite(100, screenH - 200, 'run_right');
                this.player.displayHeight = 100;
                this.player.scaleX = this.player.scaleY;
                this.player.setBounce(0.1);
                this.player.setCollideWorldBounds(true);
                this.player.body.onWorldBounds = true;
                this.player.lastDirection = 'right';

                this.cameras.main.startFollow(this.player, true, 0.08, 0.08);

                // 5. ENEMIES
                this.enemies = this.physics.add.group();

                for (let i = 0; i < 20; i++) {
                    let x = Phaser.Math.Between(600, mapWidth - 200);
                    let y = 100;
                    let enemy = this.enemies.create(x, y, 'enemy_right');

                    enemy.displayHeight = 50;
                    enemy.scaleX = enemy.scaleY;
                    enemy.setBounce(1);
                    enemy.setCollideWorldBounds(true);
                    enemy.setVelocityX(Phaser.Math.Between(-150, 150));
                }

                // Setup particles for explosion
                let d = this.make.graphics({ x: 0, y: 0, add: false });
                d.fillStyle(0xffffff, 1);
                d.fillRect(0, 0, 4, 4);
                d.generateTexture('dust', 4, 4);

                this.dustEmitter = this.add.particles(0, 0, 'dust', {
                    lifespan: 300,
                    speed: { min: 50, max: 150 },
                    scale: { start: 1, end: 0 },
                    quantity: 10,
                    on: false
                });

                // COLLIDERS
                this.physics.add.collider(this.player, this.platforms);
                this.physics.add.collider(this.enemies, this.platforms);
                this.physics.add.collider(this.door, this.platforms);

                this.physics.add.overlap(this.player, this.enemies, this.hitEnemy, null, this);
                this.physics.add.overlap(this.player, this.door, this.winLevel, null, this);
                this.physics.add.overlap(this.swordWaves, this.enemies, this.waveHitEnemy, null, this);

                // 6. CONTROLS
                this.cursors = this.input.keyboard.createCursorKeys();
                this.jumpBtn = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
                this.attackBtn = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.Z);
                this.ultiBtn = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.X);

                this.lastAttackTime = 0;
                this.lastUltiTime = 0;

                // UI HUD
                this.add.text(20, 20, 'LEVEL 1', {
                    fontSize: '24px', fill: '#fff', stroke: '#000', strokeThickness: 4, fontFamily: fontPrimary
                }).setScrollFactor(0);

                this.add.text(20, 50, '[SPACE] Jump  [Z] Slash  [X] ULTIMATE', {
                    fontSize: '16px', fill: '#FFD700', fontFamily: fontPrimary, stroke: '#000', strokeThickness: 3
                }).setScrollFactor(0);
            }

            update(time, delta) {
                const screenH = this.scale.height;

                // --- INSTANT DEATH ON FALL ---
                if (this.player.y > screenH + 50) {
                    this.restartGame();
                }

                // --- MOVEMENT ---
                if (this.cursors.left.isDown) {
                    this.player.setVelocityX(-400);
                    this.player.lastDirection = 'left';
                    if (this.player.texture.key !== 'run_left') {
                        this.player.setTexture('run_left');
                        this.updatePlayerSize();
                    }
                } else if (this.cursors.right.isDown) {
                    this.player.setVelocityX(400);
                    this.player.lastDirection = 'right';
                    if (this.player.texture.key !== 'run_right') {
                        this.player.setTexture('run_right');
                        this.updatePlayerSize();
                    }
                } else {
                    this.player.setVelocityX(0);
                }

                if (this.jumpBtn.isDown && this.player.body.touching.down) {
                    this.player.setVelocityY(-800);
                }

                // --- ATTACK (Z) ---
                if (Phaser.Input.Keyboard.JustDown(this.attackBtn)) {
                    if (time > this.lastAttackTime + 300) { // Cooldown attack lbh cepet
                        this.shootSwordWave();
                        this.lastAttackTime = time;
                    }
                }

                // --- ULTIMATE (X) ---
                if (Phaser.Input.Keyboard.JustDown(this.ultiBtn)) {
                    if (time > this.lastUltiTime + 5000) { // Cooldown 5 detik
                        this.fireUltimate();
                        this.lastUltiTime = time;
                    }
                }

                // --- ENEMY LOGIC ---
                this.enemies.children.iterate((enemy) => {
                    if (enemy) {
                        if (enemy.body.blocked.right) {
                            enemy.setVelocityX(-150);
                            enemy.setTexture('enemy_left');
                            enemy.displayHeight = 50; enemy.scaleX = enemy.scaleY;
                        } else if (enemy.body.blocked.left) {
                            enemy.setVelocityX(150);
                            enemy.setTexture('enemy_right');
                            enemy.displayHeight = 50; enemy.scaleX = enemy.scaleY;
                        }
                    }
                });

                // Cleanup Waves (Range lebih jauh: 1000px)
                this.swordWaves.children.iterate((wave) => {
                    if (wave && (Math.abs(wave.x - this.player.x) > 1000)) {
                        wave.destroy();
                    }
                });
            }

            shootSwordWave() {
                let dir = this.player.lastDirection === 'left' ? -1 : 1;
                let startX = this.player.x + (dir * 40);
                let startY = this.player.y;

                let wave = this.add.graphics({ fillStyle: { color: 0x00FFFF } });
                let projectile = this.swordWaves.create(startX, startY, 'ground_sprite');
                projectile.setTint(0x00FFFF);
                projectile.setScale(1.5, 0.2);
                projectile.body.allowGravity = false;
                projectile.setVelocityX(dir * 1000);

                // Hilang setelah 1 detik (Range jauh)
                this.time.delayedCall(1000, () => {
                    if (projectile.active) projectile.destroy();
                });
            }

            fireUltimate() {
                // EFEK LAYAR PUTIH
                let flash = this.add.rectangle(0, 0, 10000, 10000, 0xFFFFFF);
                flash.setScrollFactor(0);
                flash.alpha = 0;

                this.tweens.add({
                    targets: flash,
                    alpha: 1,
                    duration: 100,
                    yoyo: true,
                    onComplete: () => { flash.destroy(); }
                });

                // SCREEN SHAKE
                this.cameras.main.shake(300, 0.05);

                // KILL ALL ENEMIES ON SCREEN
                let camX = this.cameras.main.scrollX;
                let camW = this.cameras.main.width;

                this.enemies.children.iterate((enemy) => {
                    if (enemy) {
                        // Cek kalau musuh ada di dalam layar (atau dekat layar)
                        if (enemy.x > camX - 100 && enemy.x < camX + camW + 100) {
                            this.dustEmitter.emitParticleAt(enemy.x, enemy.y, 50); // Huge explosion
                            enemy.destroy();
                        }
                    }
                });
            }

            waveHitEnemy(wave, enemy) {
                wave.destroy();
                this.dustEmitter.emitParticleAt(enemy.x, enemy.y, 20);
                enemy.destroy();
            }

            hitEnemy(player, enemy) {
                if (player.body.velocity.y > 0 && player.y < enemy.y - 10) {
                    enemy.destroy();
                    player.setVelocityY(-500);
                } else {
                    this.restartGame();
                }
            }

            winLevel() {
                this.physics.pause();
                const w = this.scale.width;
                const h = this.scale.height;

                let txt = this.add.text(w / 2, h / 2, 'STAGE CLEARED!', {
                    fontSize: '60px', fill: '#FFD700', stroke: '#000', strokeThickness: 10, fontFamily: fontPrimary
                }).setOrigin(0.5).setScrollFactor(0);

                this.tweens.add({
                    targets: txt,
                    scale: 1.2,
                    duration: 500,
                    yoyo: true,
                    repeat: -1
                });

                this.time.delayedCall(2000, () => {
                    this.scene.restart();
                });
            }

            restartGame() {
                this.scene.restart();
            }

            updatePlayerSize() {
                this.player.displayHeight = 100;
                this.player.scaleX = this.player.scaleY;
            }
        }

        const config = {
            type: Phaser.AUTO,
            scale: {
                mode: Phaser.Scale.RESIZE,
                width: '100%',
                height: '100%',
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            backgroundColor: '#111',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 1500 },
                    debug: false
                }
            },
            scene: [MainMenu, Level1],
            pixelArt: true,
            roundPixels: true
        };

        const game = new Phaser.Game(config);

    </script>

</body>

</html>
